name: BMVS Slot Check

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler can drift a few minutes under
    # load - that's normal and fine for this use case.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual check from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the state file back

concurrency:
  group: bmvs-slot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run slot check (single pass)
        env:
          BMVS_POSTCODE: ${{ secrets.BMVS_POSTCODE }}
          BMVS_TARGET_CENTRES: ${{ secrets.BMVS_TARGET_CENTRES }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python bmvs_slot_watcher.py --once

      - name: Commit updated state (if changed)
        run: |
          git config user.name "bmvs-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- bmvs_state.json; then
            git add bmvs_state.json
            git commit -m "Update slot state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state change, nothing to commit."
          fi
