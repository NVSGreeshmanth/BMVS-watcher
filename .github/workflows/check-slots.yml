name: BMVS Slot Check

on:
  schedule:
    # Hourly backup only. The main 15-minute trigger is cron-job.org calling
    # the workflow_dispatch API, because GitHub's own scheduler is unreliable
    # (it skipped every slot for hours after this repo was created).
    - cron: "41 * * * *"
  # manual "Run workflow" button, and the cron-job.org trigger
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the state file back

concurrency:
  group: bmvs-slot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Official Playwright image: Python and Chromium (with all system
    # libraries) preinstalled, so each run skips the ~3 minute install.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Playwright Python package
        # image has the browsers but not the Python package; version must
        # match the image tag so the preinstalled Chromium is used
        run: python3 -m pip install -q --break-system-packages playwright==1.62.0

      - name: Run slot check (single pass)
        env:
          BMVS_POSTCODE: ${{ secrets.BMVS_POSTCODE }}
          BMVS_TARGET_CENTRES: ${{ secrets.BMVS_TARGET_CENTRES }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python3 bmvs_slot_watcher.py --once

      - name: Commit updated state (if changed)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "bmvs-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- bmvs_state.json; then
            git add bmvs_state.json
            git commit -m "Update slot state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state change, nothing to commit."
          fi
