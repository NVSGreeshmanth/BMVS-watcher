name: BMVS Slot Check

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler can drift a few minutes under
    # load - that's normal and fine for this use case.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual check from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the state file back

concurrency:
  group: bmvs-slot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Official Playwright image: Python, Playwright and Chromium (with all
    # system libraries) preinstalled, so each run skips the ~3 minute install.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Run slot check (single pass)
        env:
          BMVS_POSTCODE: ${{ secrets.BMVS_POSTCODE }}
          BMVS_TARGET_CENTRES: ${{ secrets.BMVS_TARGET_CENTRES }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python3 bmvs_slot_watcher.py --once

      - name: Commit updated state (if changed)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "bmvs-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- bmvs_state.json; then
            git add bmvs_state.json
            git commit -m "Update slot state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state change, nothing to commit."
          fi
